# Netlify deploys a static frontend plus deterministic serverless API adapters.
# The canonical Python/FastAPI/LangGraph application remains available locally
# and through the Docker configuration; this file does not run it on Netlify.
[build]
  command = "node scripts/build_netlify_demo.mjs"
  publish = "dist-netlify-demo"

[build.environment]
  # Netlify detects the canonical Python application before running the
  # Node-only adapter build. Pin a supported interpreter so its automatic
  # dependency preparation uses published pydantic-core wheels instead of
  # attempting a Rust source build.
  # The public adapter is a small Node-only Function implementation.
  NODE_VERSION = "22"
  PYTHON_VERSION = "3.12"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["data/attractions.json"]

# The generated public page refers to stable asset names (index.html, app.js,
# and styles.css). Require a fresh validation after each deploy so a visitor
# cannot keep an older interface in a browser cache.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "no-cache"
