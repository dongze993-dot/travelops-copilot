services:
  travelops:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # This demo uses local deterministic data only; no model-provider key is required.
      TRAVELOPS_DB_PATH: /app/runtime/travelops_mock_crm.db
    volumes:
      - travelops_runtime:/app/runtime
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  travelops_runtime:
