services:
  travelops:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      TRAVELOPS_DB_PATH: /app/runtime/travelops_mock_crm.db
      # Docker Compose reads a local .env automatically. Empty/missing values
      # keep v2 deterministic, and the key never belongs in this YAML file.
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      TRAVELOPS_LLM_ENABLED: "${TRAVELOPS_LLM_ENABLED:-false}"
      TRAVELOPS_LLM_PROVIDER: "${TRAVELOPS_LLM_PROVIDER:-deepseek}"
      TRAVELOPS_LLM_BASE_URL: "${TRAVELOPS_LLM_BASE_URL:-https://api.deepseek.com}"
      TRAVELOPS_LLM_MODEL: "${TRAVELOPS_LLM_MODEL:-deepseek-chat}"
      TRAVELOPS_LLM_TIMEOUT_SECONDS: "${TRAVELOPS_LLM_TIMEOUT_SECONDS:-20}"
      TRAVELOPS_LLM_MAX_RETRIES: "${TRAVELOPS_LLM_MAX_RETRIES:-1}"
      TRAVELOPS_LLM_MAX_TOKENS: "${TRAVELOPS_LLM_MAX_TOKENS:-800}"
      TRAVELOPS_LLM_TEMPERATURE: "${TRAVELOPS_LLM_TEMPERATURE:-0}"
    volumes:
      - travelops_runtime:/app/runtime
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  travelops_runtime:
