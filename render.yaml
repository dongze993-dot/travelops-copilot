services:
  - type: web
    name: travelops-copilot-dongze
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      # Keep the public service deterministic. An unauthenticated model route
      # could otherwise expose the service owner's API budget.
      - key: TRAVELOPS_LLM_ENABLED
        value: "false"
      # Disable all mock-CRM reads and writes on the public service.
      - key: TRAVELOPS_PUBLIC_DEMO_MODE
        value: "true"
      # This is harmless while public demo mode is enabled, and keeps local
      # behavior explicit if the flag is intentionally changed later.
      - key: TRAVELOPS_DB_PATH
        value: /tmp/travelops_mock_crm.db
