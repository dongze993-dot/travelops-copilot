services:
  - type: web
    name: travelops-copilot-dongze
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      # Keep the public portfolio deterministic. An unauthenticated public
      # model endpoint could otherwise expose the owner's API budget.
      - key: TRAVELOPS_LLM_ENABLED
        value: "false"
      # The mock CRM is intentionally ephemeral in the public demo.
      - key: TRAVELOPS_DB_PATH
        value: /tmp/travelops_mock_crm.db
